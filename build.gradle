plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'sk.ivankohut'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
}

kotlin {
    jvmToolchain(17)
}

test {
    useJUnitPlatform()
}

// Unit tests for src/main/resources/fit-to-page.js, run with Node's built-in
// test runner (see src/test/js). The com.github.node-gradle.node plugin
// downloads the pinned Node distribution automatically.
node {
    download = true
    version = '24.22.0'
}

tasks.register('nodeTest', com.github.gradle.node.task.NodeTask) {
    description = 'Runs the JavaScript unit tests with Node.js.'
    group = 'verification'
    workingDir = projectDir
    script = file('src/test/js/fit-to-page.test.mjs')
    args = ['--test']
    inputs.files(fileTree('src/test/js'), 'src/main/resources/fit-to-page.js')
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn 'nodeTest'
}

shadowJar {
//    archiveBaseName.set('myapp')  // Or use project.name
    archiveClassifier.set('')     // Omit classifier for clean name
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': 'sk.ivankohut.MainKt'
    }
    mergeServiceFiles()  // Handles duplicates like Spring Boot
}

